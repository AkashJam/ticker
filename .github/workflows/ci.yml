# Written now per portfolio.md's Day 1-2 plan, but won't pass until go.mod
# and the service source exist — Days 5-9 (§15).

name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` isn't directly usable inside a step's `if:` condition
    # (GitHub Actions restriction) — expose it via job-level env instead, so
    # the "Trigger infra deploy" step below can check env.HAS_INFRA_TOKEN.
    env:
      HAS_INFRA_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Both the action's own major version AND the `version:` input had to
      # change, not just the input — golangci-lint-action@v6 only knows how
      # to run golangci-lint v1.x; v7+ is required for v2 (confirmed against
      # the action's own README: "v6.0.0+ ... v1 only", "v7.0.0 supports
      # golangci-lint v2 only"). `version: latest` under the old @v6 setup
      # had resolved to a stale v1.64.8 (built with Go 1.24, too old for
      # this module's Go 1.26) — and even a fresh v1.x would still fail,
      # since .golangci.yml uses the v2 config schema (`version: "2"`,
      # `linters.default: standard`), which v1.x can't parse at all.
      # v2.13.1 is exactly what was validated locally (0 issues, see phase3.md).
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1

      - run: go vet ./...
      - run: go test ./...

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 --target runtime \
            -t "$REGISTRY/ticker:${{ github.sha }}" \
            -t "$REGISTRY/ticker:latest" \
            --push \
            .

      # See the matching step/comment in portfolio/.github/workflows/ci.yml
      # — same cross-repo CD gap, same fix. Conditioned on the secret
      # existing — deferred setup skips this cleanly instead of failing.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.HAS_INFRA_TOKEN == 'true'
        name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/infra
          event-type: image-pushed
